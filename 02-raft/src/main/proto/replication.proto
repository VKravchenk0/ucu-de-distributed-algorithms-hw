syntax = "proto3";

package ua.vk.ucu.dads.grpc;

option java_package = "ua.vk.ucu.dads.grpc";
option java_multiple_files = true;

service ReplicationService {
  rpc RequestVote(RequestVoteRPC) returns (ResponseVoteRPC);
  rpc AppendEntries(RequestAppendEntriesRPC) returns (ResponseAppendEntriesRPC);
}

message RequestVoteRPC {
    int32 term = 1;
    int32 candidateId = 2;
    int32 lastLogIndex = 3;
    int32 lastLogTerm = 4;
}

message ResponseVoteRPC {
    int32 term = 1;
    bool voteGranted = 2;
}

message RequestAppendEntriesRPC {
    message LogEntry {
        int32 term = 1;
        string command = 2;
    }

    int32 term = 1;
    int32 leaderId = 2;
    int32 prevLogIndex = 3;
    int32 prevLogTerm = 4;
    repeated LogEntry entries = 5;
    int32 leaderCommit = 6;
}

message ResponseAppendEntriesRPC {
    int32 term = 1;
    bool success = 2;
}
